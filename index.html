<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Resume Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      .resume-preview {
        font-family: 'Lora', serif;
      }
      @media print {
        @page {
          size: auto;
          margin: 0;
        }
        body {
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* Hide everything on the page by default for printing */
        body * {
          visibility: hidden;
        }

        /* Make the resume container and its contents visible */
        .print-container, .print-container * {
          visibility: visible;
        }

        /* Position the resume container to fill the page */
        .print-container {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
        }
        
        .resume-preview {
          /* Remove web-only styles and standardize for print */
          margin: 0 !important;
          border: none !important;
          box-shadow: none !important;
          transform: scale(1) !important;
          width: 100% !important;
          border-radius: 0 !important;
          padding: 2.5rem !important; /* Standardize margin for printing */
        }
      }
    </style>
